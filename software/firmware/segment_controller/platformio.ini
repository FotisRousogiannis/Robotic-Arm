; PlatformIO project for the per-segment ESP32 controller.
;
; One firmware, configured per segment (base, wrist, ...) via build flags
; or the values in include/config.h. Handles local servo drive (PCA9685),
; encoder feedback (AS5600 behind a TCA9548A mux) and host comms.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.1
    ; AS5600 is read directly over Wire in this skeleton; add a library
    ; here if you prefer one, e.g.:
    ; robtillaart/AS5600 @ ^0.6.4
build_flags =
    -DSEGMENT_NAME=\"base\"
