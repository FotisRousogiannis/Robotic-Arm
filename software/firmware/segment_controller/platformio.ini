; PlatformIO project for the per-segment ESP32 controller.
;
; One firmware, configured per segment (base, wrist, ...) via build flags
; or the values in include/config.h. Handles local servo drive (PCA9685),
; encoder feedback (AS5600 behind a TCA9548A mux) and host comms.

; --- Default: serial test firmware (no agent needed) -------------------
; Build/flash this to bench-test the wrist & gearboxes over USB serial.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.1
    ; AS5600 is read directly over Wire in this skeleton; add a library
    ; here if you prefer one, e.g.:
    ; robtillaart/AS5600 @ ^0.6.4
build_flags =
    -DSEGMENT_NAME=\"base\"

; --- micro-ROS build (host integration) --------------------------------
; The final transport: each ESP32 is a ROS 2 node via micro-ROS. Bring the
; micro-ROS transport into src/ (guarded by USE_MICRO_ROS) before using
; this env, and run the agent on the host:
;   ros2 run micro_ros_agent micro_ros_agent udp4 --port 8888
[env:esp32-microros]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DUSE_MICRO_ROS
lib_deps =
    ${env:esp32dev.lib_deps}
    https://github.com/micro-ROS/micro_ros_platformio
